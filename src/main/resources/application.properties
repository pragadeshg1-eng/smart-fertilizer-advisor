# ===================================================================
# Vayal - Smart Fertilizer Advisor Application Configuration
# ===================================================================
server.port=8080

# Spring Application Name
spring.application.name=vayal-fertilizer-advisor

# Database Configuration (MySQL)
# Passwords are NEVER hardcoded in source code (Security Best Practice).
# Supply via environment variable SPRING_DATASOURCE_PASSWORD or system property.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/fertilizer_advisor_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings (Auto-detects dialect)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Disable automatic SQL script runner in favor of DataInitializer CommandLineRunner
spring.sql.init.mode=never

# Jackson JSON Settings
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.serialization.write-dates-as-timestamps=false

# Static Resource Handling
spring.web.resources.static-locations=classpath:/static/
