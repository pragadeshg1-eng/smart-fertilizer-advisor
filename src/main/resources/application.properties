# ===================================================================
# Vayal - Smart Fertilizer Advisor Application Configuration
# ===================================================================
server.port=8080

# Spring Application Name
spring.application.name=vayal-fertilizer-advisor

# Database Configuration
# Defaults to embedded H2 so the application runs immediately without requiring an external MySQL server.
# To connect to MySQL, set SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, and SPRING_DATASOURCE_PASSWORD.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:fertilizer_advisor_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# Embedded H2 Web Console (Available at http://localhost:8080/h2-console when in H2 mode)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# JPA & Hibernate Settings (Auto-detects dialect for H2 and MySQL)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Disable automatic SQL script runner in favor of DataInitializer CommandLineRunner
spring.sql.init.mode=never

# Jackson JSON Settings
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.serialization.write-dates-as-timestamps=false

# Static Resource Handling
spring.web.resources.static-locations=classpath:/static/
